<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=682, height=1024, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 682px;
    height: 1024px;
    overflow: hidden;
    background: #000;
  }
  video {
    position: absolute;
    top: 0; left: 0;
    width: 682px;
    height: 1024px;
    object-fit: contain;
    background: #000;
  }
</style>
</head>
<body>
<video autoplay loop muted playsinline id="v"></video>
<script>
  var params = new URLSearchParams(window.location.search);
  var src = params.get('src');
  var v = document.getElementById('v');
  if (src) {
    v.src = decodeURIComponent(src);
    v.muted = true;
    v.load();
    v.play().catch(function() {
      document.body.addEventListener('click', function() { v.play(); });
    });
  }
</script>
</body>
</html>
