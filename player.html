<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  video {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
</style>
</head>
<body>
<video autoplay loop muted playsinline id="v"></video>
<script>
  var params = new URLSearchParams(window.location.search);
  var src = params.get('src');
  var v = document.getElementById('v');
  if (src) {
    v.src = decodeURIComponent(src);
    v.muted = true;
    v.load();
    v.play().catch(function() {
      document.body.addEventListener('click', function() { v.play(); });
    });
  }
</script>
</body>
</html>
